name: asop-spec watch

# Weekly, and on demand: is there an asop-spec release newer than the lock, and
# does it add fields the hub neither knows (agentco/field_provenance.py) nor
# stores (the ASOP record's columns)? If so, open ONE issue with the proposed
# update — never a duplicate: the title is the key, and an open issue with the
# same title is left alone. tools/asop_fields.py holds the logic, and
# tests/test_asop_fields_tool.py tests it offline.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: asop-spec-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --extra dev --python 3.12
      - name: Compare the newest asop-spec with what the hub forwards and stores
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-sync python tools/asop_fields.py watch --github
