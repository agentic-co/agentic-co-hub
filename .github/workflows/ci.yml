name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege. A workflow with no `permissions:` takes the repository
# default, which on many repos is a write-scoped GITHUB_TOKEN — handed to
# every third-party action in the job. Nothing here writes to the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  leakguard:
    # Runs FIRST and independently of the tests. A commit that carries identity
    # into a public repo is a different class of failure from a failing test,
    # and it must not be reported as one line in a test summary.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan for identity leakage
        # No leakguard.toml in the tree on purpose — a denylist of real names is
        # itself a list of real names. CI reads the real list from the LEAKGUARD_CONFIG
        # secret when it is available and falls back to the base rules when it is not.
        env:
          # The real list of internal names lives in a repository secret, never in the tree.
          # Pull requests from forks get no secrets: they fall back to the base rules.
          LEAKGUARD_CONFIG: ${{ secrets.LEAKGUARD_CONFIG }}
        run: |
          if [ -n "${LEAKGUARD_CONFIG:-}" ]; then
            printf '%s' "$LEAKGUARD_CONFIG" > "$RUNNER_TEMP/leakguard.toml"
            echo "leakguard: running with the private denylist"
            python3 tools/leakguard/leakguard.py --root . --config "$RUNNER_TEMP/leakguard.toml"
          else
            echo "::notice::leakguard: no private denylist available (fork or unset secret); base rules only"
            python3 tools/leakguard/leakguard.py --root .
          fi

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python-version }}
      # ALL the extras the suite imports, not just `dev`. This ran `--extra dev`
      # alone until the first push to a real runner, because every local run
      # used all three and the gap was invisible on the developer's machine —
      # the same shape as a test that only passes in one environment, which
      # this project has already been bitten by once.
      - run: uv run --extra dev --extra server --extra mcp --python ${{ matrix.python-version }} pytest -q
      # The contract's own suite used to run here, when the contract was a
      # workspace member of this repo. It now lives in github.com/mabidoli/asop
      # and is tested there, against every implementation rather than this one.

  contract:
    # The plane supports every `asop-spec` in its pin (`>=0.4.0,<1`), and the
    # job above only ever tests the LOCKED one. Before this job the plane
    # stopped importing on 0.5.0 — the SQL column guard fired — and nothing
    # here could have said so, because nothing here installed 0.5.0.
    #
    # The floor, the version that once broke the plane (0.5.0) and the newest
    # (0.6.0, on PyPI since 2026-10-17). One Python: this is a contract
    # question, and the matrix above answers the language one.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        contract:
          - "asop-spec==0.4.0"
          - "asop-spec==0.5.0"
          - "asop-spec==0.6.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --extra dev --extra server --extra mcp --python 3.12
      - run: uv pip install --python .venv/bin/python "${{ matrix.contract }}"
      - name: The installed contract is the one asked for
        run: .venv/bin/python -c "import importlib.metadata as m; print('asop-spec', m.version('asop-spec'))"
      - run: uv run --no-sync pytest -q

  postgres:
    # The Postgres backend, as a GATE rather than as something a developer may
    # remember to run. `conftest` adds the `postgres` fixture parameter only
    # when AGENTCO_TEST_PG names a DSN, which is the honest design — a suite
    # that silently dropped a backend would report a pass count that quietly
    # excluded it. The consequence is that without this job, every claim about
    # this backend rested on someone having run it by hand.
    #
    # One Python, not the matrix: 3.12 is what the image ships. Whether the
    # code runs on 3.11 and 3.13 is a language-compatibility question the
    # matrix above answers; whether it runs on Postgres is a different one, and
    # running it three times would pay three times for the same answer.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agentco
          # Throwaway credentials for a container that exists for the length of
          # one job and listens only to it. Written in the open deliberately:
          # a secret here would imply this database is worth protecting, and
          # the next person would wonder what is in it.
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: agentco
        options: >-
          --health-cmd "pg_isready -U agentco"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      AGENTCO_TEST_PG: postgresql://agentco:ci-only-not-a-secret@127.0.0.1:5432/agentco
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv python install 3.12
      # ASSERT THE BACKEND IS ACTUALLY ACTIVE before running anything against it.
      # A mistyped variable name would otherwise produce a green job that proves
      # nothing about Postgres, which is the failure this whole job exists to
      # close — and it would look exactly like success.
      - name: Refuse to pass without the Postgres backend
        run: |
          uv run --extra dev --extra server --extra mcp --extra postgres --python 3.12 python -c "
          from tests.conftest import BACKENDS
          assert 'postgres' in BACKENDS, f'postgres backend is not active: {BACKENDS}'
          print('backends under test:', BACKENDS)
          "
      - run: uv run --extra dev --extra server --extra mcp --extra postgres --python 3.12 pytest -q

  image:
    # The image builds, and the thing inside it works.
    #
    # This job exists because its absence cost twelve days: 42fcf7a moved the
    # ASOP contract to its own repository and deleted `packages/`, correctly,
    # and left the Dockerfile copying that directory. Every `docker build` on
    # main failed from that commit onward and CI reported green the whole time,
    # because CI ran the suite and never built a container. A packaging break
    # only a downstream consumer can see is one that will happen again.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        run: docker build -t agentco:ci .
      - name: The contract resolves, and the shims ARE it
        # Not just "imports": the plane re-exports the contract's types, and an
        # image that shadowed them with its own copies would satisfy an import
        # check while quietly running a second, drifting contract.
        run: |
          docker run --rm --entrypoint python agentco:ci -c "
          import asop, asop.revision, agentco.policy as policy
          assert policy.RevisionPolicyError is asop.revision.RevisionPolicyError
          assert policy.check_asop_revision is asop.revision.check_asop_revision
          print('asop resolves from', asop.__file__)
          "
      - name: The image serves on Postgres, as the compose `pg` profile runs it
        # The image shipped without the Postgres driver while docker-compose.yml
        # documented `--profile pg` against it: the registry crash-looped on
        # start and every check above stayed green, because none of them ran
        # the image on Postgres. This one does, end to end.
        run: |
          set -euo pipefail
          docker network create agentco-ci-pg
          docker run -d --name agentco-ci-postgres --network agentco-ci-pg \
            -e POSTGRES_USER=agentco -e POSTGRES_PASSWORD=ci-only-not-a-secret -e POSTGRES_DB=agentco \
            postgres:16-alpine
          for i in $(seq 1 30); do docker exec agentco-ci-postgres pg_isready -U agentco && break; sleep 2; done
          docker run -d --name agentco-ci-pg-registry --network agentco-ci-pg -p 8788:8787 \
            -e AGENTCO_DB=postgresql://agentco:ci-only-not-a-secret@agentco-ci-postgres:5432/agentco \
            agentco:ci serve --host 0.0.0.0 --port 8787
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8788/events || true)
            [ "$code" = "401" ] && { echo "registry serves on Postgres"; exit 0; }
            sleep 2
          done
          echo "FAIL: the registry never answered on Postgres (last code: ${code:-none})"
          docker logs agentco-ci-pg-registry
          exit 1
      - name: Unauthenticated is 401, and 200 would be the failure
        # The image's own healthcheck encodes this: a 200 here means the key
        # table loaded OPEN, which is the one outcome worse than being down.
        run: |
          set -euo pipefail
          docker run -d --name agentco-ci -p 8787:8787 \
            -e AGENTCO_REGISTRY_DB=/tmp/registry.sqlite3 \
            -e AGENTCO_WORK_STORE=/tmp/work.jsonl \
            -e AGENTCO_SOP_STORE=/tmp/sops.jsonl \
            agentco:ci serve --host 0.0.0.0 --port 8787
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8787/events || true)
            [ "$code" = "401" ] && { echo "registry refused an unauthenticated read, as it must"; exit 0; }
            [ "$code" = "200" ] && { echo "FAIL: /events answered 200 unauthenticated — the key table loaded open"; docker logs agentco-ci; exit 1; }
            sleep 2
          done
          echo "FAIL: the registry never answered (last code: ${code:-none})"
          docker logs agentco-ci
          exit 1
      - name: Stop
        if: always()
        run: |
          docker rm -f agentco-ci agentco-ci-pg-registry agentco-ci-postgres || true
          docker network rm agentco-ci-pg || true
