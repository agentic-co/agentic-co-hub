name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege. A workflow with no `permissions:` takes the repository
# default, which on many repos is a write-scoped GITHUB_TOKEN — handed to
# every third-party action in the job. Nothing here writes to the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  leakguard:
    # Runs FIRST and independently of the tests. A commit that carries identity
    # into a public repo is a different class of failure from a failing test,
    # and it must not be reported as one line in a test summary.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Scan for identity leakage
        # No leakguard.toml in the tree on purpose — a denylist of real names is
        # itself a list of real names. CI runs base rules; a fork or a private
        # mirror can supply its own via --config.
        run: python3 tools/leakguard/leakguard.py --root .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python-version }}
      # ALL the extras the suite imports, not just `dev`. This ran `--extra dev`
      # alone until the first push to a real runner, because every local run
      # used all three and the gap was invisible on the developer's machine —
      # the same shape as a test that only passes in one environment, which
      # this project has already been bitten by once.
      - run: uv run --extra dev --extra server --extra mcp --python ${{ matrix.python-version }} pytest -q
      # The contract's own suite used to run here, when the contract was a
      # workspace member of this repo. It now lives in github.com/mabidoli/asop
      # and is tested there, against every implementation rather than this one.
