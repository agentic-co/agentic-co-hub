[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentco"
version = "0.1.0"
description = "A coordination layer for organisations running more than one agentic harness"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
keywords = ["agents", "coordination", "mcp", "ai", "developer-tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

# Standard library first. A dependency has to earn its place — see CONTRIBUTING.md.
dependencies = []

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
mcp = ["mcp<2"]
dev = ["pytest>=8.0"]
# The ASOP eval harness (`evals/`, not shipped in the wheel). LiteLLM is a
# heavy transitive tree and only the harness needs it — an adopter running
# the coordination layer must never pay for an experiment they are not
# running. See evals/README.md.
eval = ["litellm>=1.70"]

[tool.hatch.build.targets.wheel]
# `evals` is deliberately absent: it lives in the repo, not in the package.
packages = ["agentco"]
