[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentco"
version = "0.1.0"
description = "A coordination layer for organisations running more than one agentic harness"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
keywords = ["agents", "coordination", "mcp", "ai", "developer-tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

# Standard library first. A dependency has to earn its place — see CONTRIBUTING.md.
# `agentco-asop` is the one exception, and it earns its place by being this
# repo's own extraction: the gate schema, refusal vocabulary, and SOP record
# contract in `packages/asop/` moved out so the AgentCo Harness (a separate
# repo) can validate against the same shape without depending on this
# package. `agentco/gates.py`, `agentco/errors.py` and `agentco/sop.py` are
# thin shims over it — see docs/architecture.md.
dependencies = ["agentco-asop"]

[tool.uv.sources]
agentco-asop = { workspace = true }

[tool.uv.workspace]
members = ["packages/asop"]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
mcp = ["mcp<2"]
# The Postgres storage backend (agentco/pgadapter.py). Optional because the
# default install stays dependency-free — this is only pulled in by a
# deployment that sets AGENTCO_DB to a postgresql:// URL.
postgres = [
    "psycopg[binary]>=3.1",
]
dev = ["pytest>=8.0"]
# The ASOP eval harness (`evals/`, not shipped in the wheel). LiteLLM is a
# heavy transitive tree and only the harness needs it — an adopter running
# the coordination layer must never pay for an experiment they are not
# running. See evals/README.md.
eval = ["litellm>=1.70"]

[tool.hatch.build.targets.wheel]
# `evals` is deliberately absent: it lives in the repo, not in the package.
packages = ["agentco"]

[tool.pytest.ini_options]
# Scoped to this package's own suite. `packages/asop/` is a separate
# workspace member with its own `tests/` — same basenames (`test_gates.py`,
# `test_sop.py`) by design, since they test the same contract from each
# side of the shim, which collides under pytest's default rootdir-relative
# import when both are swept into one run. Run the asop suite on its own:
# `uv run pytest packages/asop/tests -q`, or `cd packages/asop && uv run
# --with pytest pytest -q`.
testpaths = ["tests"]
