[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentco"
version = "0.1.0"
description = "A coordination layer for organisations running more than one agentic harness"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
keywords = ["agents", "coordination", "mcp", "ai", "developer-tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

# Standard library first. A dependency has to earn its place — see CONTRIBUTING.md.
# `asop-spec` is the one exception, and it earns its place by being the
# standard this plane implements rather than a library it borrows. The gate
# schema, refusal vocabulary and SOP record contract now live in their own
# repository (github.com/mabidoli/asop) and arrive here by version, like they
# do for every other implementation. `agentco/gates.py`, `agentco/errors.py`
# and `agentco/sop.py` are thin shims over it — see docs/architecture.md.
dependencies = ["asop-spec>=0.1.0"]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
mcp = ["mcp<2"]
# The Postgres storage backend (agentco/pgadapter.py). Optional because the
# default install stays dependency-free — this is only pulled in by a
# deployment that sets AGENTCO_DB to a postgresql:// URL.
postgres = [
    "psycopg[binary]>=3.1",
]
dev = ["pytest>=8.0"]
# The ASOP eval harness (`evals/`, not shipped in the wheel). LiteLLM is a
# heavy transitive tree and only the harness needs it — an adopter running
# the coordination layer must never pay for an experiment they are not
# running. See evals/README.md.
eval = ["litellm>=1.70"]

[tool.hatch.build.targets.wheel]
# `evals` is deliberately absent: it lives in the repo, not in the package.
packages = ["agentco"]

[tool.pytest.ini_options]
# Scoped to this package's own suite. The contract's own tests travel with
# the contract now, in its own repository, and are run there.
testpaths = ["tests"]
