[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentco-asop"
version = "0.1.0"
description = "The ASOP contract — shared gate schema, refusal vocabulary, and SOP record shape for any plane or harness that speaks it"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
keywords = ["agents", "asop", "coordination", "contract"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

# Standard library first, same discipline as the parent repo (CONTRIBUTING.md)
# — this package is imported by both the coordination plane and any harness
# that adopts it, so a dependency here is a dependency forced on both.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["asop"]
