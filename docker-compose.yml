# The registry, its state volume, and the cadence job that reads it.
#
# `docker compose up -d registry` is the whole of it. Two decisions in here are
# the ones worth reading before changing:
#
#   * The port is published to 127.0.0.1 ONLY. The service holds a company's
#     scope claims and authenticates with per-actor shared secrets over plain
#     HTTP, so putting it on a routable interface means the secrets cross the
#     network in the clear. Reaching it from another machine is a deliberate
#     act: terminate TLS in front of it, and change this line where a reviewer
#     can see you did.
#
#   * The key file is mounted READ-ONLY from the host and is never built into
#     the image. `keygen` writes it; this only ever reads it.

services:
  registry:
    build:
      context: .
    image: agentco:local
    container_name: agentco-registry
    restart: unless-stopped
    # Loopback only — see the note above.
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - agentco-state:/var/lib/agentco
      # actor → shared secret, produced by `python3 -m agentco keygen <actor>`.
      - ./keys.json:/run/secrets/agentco-keys.json:ro
      # The git: resolver reads repo paths on THIS filesystem. Mount whatever
      # you snapshot, read-only — the resolver only ever runs `git rev-parse`,
      # and a coordination layer with write access to your repos is a different
      # threat model than the one this project argues for.
      - ${AGENTCO_REPOS:-./repos}:/repos:ro
    environment:
      # The identity excluded from the adoption gate's own publisher count.
      AGENTCO_REGISTRY_OPERATOR: ${AGENTCO_REGISTRY_OPERATOR:-operator}
      # Unset here means the SQLite-on-the-volume default two lines below.
      # Set AGENTCO_PG_DSN (compose's `pg` profile, see the `postgres` service
      # below) and the registry, work queue and SOP library all move to that
      # one database — same "AGENTCO_DB names the durable backend" rule
      # docs/roadmap.md#where-the-stores-live states, just with the DSN kept
      # in one place instead of typed twice.
      AGENTCO_DB: ${AGENTCO_PG_DSN:-}
    security_opt:
      - no-new-privileges:true
    # Advisory service, small footprint. The cap exists so a runaway resolver
    # cannot take the host down with it.
    mem_limit: 512m

  # Opt-in durable backend, one step further than the SQLite file on
  # `agentco-state`: `docker compose --profile pg up -d postgres registry`,
  # with `AGENTCO_PG_DSN` pointing `registry`'s `AGENTCO_DB` (above) at this
  # service. Absent `--profile pg`, this service does not exist and nothing
  # about the default (JSONL, then SQLite via a bare `AGENTCO_DB=<path>`)
  # changes — the storage backend stays an opt-in, not a new requirement.
  postgres:
    image: postgres:16-alpine
    profiles: ["pg"]
    container_name: agentco-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - agentco-pg-state:/var/lib/postgresql/data
    environment:
      # `${VAR:?message}` is NOT usable here even though this service only
      # STARTS under `--profile pg` — Compose interpolates every service's
      # `environment:` block while parsing the file, profile or not, so a
      # required-variable error here would break `docker compose config`/`up`
      # for the DEFAULT path (no Postgres involved at all) too. The default
      # below is therefore an obvious, checked-in placeholder, not a real
      # secret — set AGENTCO_PG_PASSWORD in a `.env` compose reads (or export
      # it) before actually starting this profile.
      POSTGRES_USER: ${AGENTCO_PG_USER:-agentco}
      POSTGRES_PASSWORD: ${AGENTCO_PG_PASSWORD:-change-me-before-using-the-pg-profile}
      POSTGRES_DB: ${AGENTCO_PG_DB:-agentco}
    security_opt:
      - no-new-privileges:true

  # The cadence boundary, as a one-shot rather than a sidecar: divergence is
  # delivered on a schedule a team chooses, and a container that decides that
  # schedule for them has taken the product decision away from them.
  #
  #   docker compose run --rm digest                 # print, deliver nothing
  #   docker compose run --rm digest digest --deliver # at the boundary
  #
  # Put that second line in cron or a systemd timer on the host.
  digest:
    build:
      context: .
    image: agentco:local
    profiles: ["ops"]
    volumes:
      - agentco-state:/var/lib/agentco
      - ./keys.json:/run/secrets/agentco-keys.json:ro
      - ${AGENTCO_REPOS:-./repos}:/repos:ro
    environment:
      # Set to post the digest somewhere. Absent means print-only, which is the
      # honest default: delivery reaches other people.
      AGENTCO_DIGEST_WEBHOOK: ${AGENTCO_DIGEST_WEBHOOK:-}
      # Same backend `registry` is pointed at — a digest reading a different
      # store than the one being written to would silently report nothing.
      AGENTCO_DB: ${AGENTCO_PG_DSN:-}
    command: ["digest"]

  # The pulse, same shape as the digest: a one-shot the host schedules. Bare
  # `pulse` is a dry run. `--apply` runs the sweeps and records the run; the
  # exit code is the worst consequence class (0 ok, 1 attention, 2 fatal), so
  # alert on non-zero and read the output for what.
  #
  #   docker compose run --rm pulse                                  # look, change nothing
  #   docker compose run --rm pulse pulse --apply --every 15m        # every 15 minutes, from cron
  pulse:
    build:
      context: .
    image: agentco:local
    profiles: ["ops"]
    volumes:
      - agentco-state:/var/lib/agentco
      - ./keys.json:/run/secrets/agentco-keys.json:ro
    environment:
      # actor=duration, comma-separated: who is expected to publish how often.
      # Unset means nobody's silence is judged; the pulse still sweeps and reports.
      AGENTCO_CADENCE: ${AGENTCO_CADENCE:-}
      AGENTCO_PULSE_EVERY: ${AGENTCO_PULSE_EVERY:-}
      # Same backend `registry` is pointed at — see the note on `digest`.
      AGENTCO_DB: ${AGENTCO_PG_DSN:-}
    command: ["pulse"]

volumes:
  agentco-state:
  # Only created when the `pg` profile is used; harmless and unused otherwise.
  agentco-pg-state:
